<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card shadow-lg">
                <div class="card-header {% if puan >= 70 %}bg-success{% else %}bg-danger{% endif %} text-white">
                    <h3>Sınav Sonucu: {{ durum }}</h3>
                </div>
                <div class="card-body">
                    <h1 class="display-1 fw-bold">{{ puan }}</h1>
                    <p class="text-muted">Toplam 100 Puan Üzerinden</p>
                    <hr>
                    <div class="row">
                        <div class="col-4">
                            <h4 class="text-success">{{ dogru }}</h4>
                            <span>Doğru</span>
                        </div>
                        <div class="col-4">
                            <h4 class="text-danger">{{ yanlis }}</h4>
                            <span>Yanlış</span>
                        </div>
                        <div class="col-4">
                            <h4 class="text-warning">{{ bos }}</h4>
                            <span>Boş</span>
                        </div>
                    </div>
                </div>
                <div class="card-footer py-3">
                    <a href="{% url 'deneme_sinavi' %}" class="btn btn-outline-primary me-2">Tekrar Çöz</a>
                    <a href="{% url 'yanlislarim' %}" class="btn btn-primary">Hatalarımı İncele</a>
                </div>
            </div>
        </div>
    </div>
</div>
