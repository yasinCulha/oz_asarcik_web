{% extends 'base.html' %}
{% block content %}
<section class="py-5 bg-light" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg" style="border-radius: 0 !important;">
                    <div class="card-body p-5">
                        <h3 class="fw-bold mb-4 text-center">KURSİYER GİRİŞİ</h3>
                        <p class="text-muted small text-center mb-4">Lütfen kurum tarafından size verilen bilgilerle giriş yapınız.</p>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: 0 !important;">
                                    <i class="fa-solid fa-circle-exclamation me-2"></i> {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Kullanıcı Adı </label>
                                <input type="text" name="username" class="form-control rounded-0" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold small">Şifre</label>
                                <input type="password" name="password" class="form-control rounded-0" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 py-3 fw-bold rounded-0">SİSTEME GİRİŞ YAP</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
